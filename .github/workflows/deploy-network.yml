name: Deploy Network (Terraform)

# Manual trigger only — pick the action from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy

# Prevent two runs from touching the same remote state at once.
concurrency:
  group: terraform-network
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Provider auth uses the runner VM's managed identity, so there are no
  # credentials to store and nothing to install (the Azure CLI is not on this
  # runner). Requires the runner to be an Azure VM with an identity assigned
  # and RBAC on the target subscription.
  ARM_USE_MSI: "true"
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  # Only needed for a *user-assigned* identity — leave the secret unset when
  # using the VM's system-assigned identity.
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  # Storage account key so the backend can read/write the state blob.
  ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
  # tfvars is git-ignored, so pass machine-specific values as TF_VAR_* env.
  # Set ALLOWED_SSH_SOURCE_IP as a repo *variable* (e.g. 70.81.108.249/32).
  TF_VAR_allowed_ssh_source_ip: ${{ vars.ALLOWED_SSH_SOURCE_IP }}

jobs:
  terraform:
    runs-on: [self-hosted, skynet]
    defaults:
      run:
        working-directory: infra/network

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner has no Terraform, no unzip, and no passwordless sudo to
      # install one — which rules out hashicorp/setup-terraform, since it
      # shells out to `unzip`. Fetch the release ourselves and unpack it with
      # python3's zipfile module, so nothing has to be installed on the box.
      # Cached under $HOME so repeat runs skip the download.
      - name: Install Terraform
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TERRAFORM_VERSION: "1.9.8"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)        arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="$HOME/.cache/terraform/$TERRAFORM_VERSION/$arch"
          if [ ! -x "$dest/terraform" ]; then
            command -v python3 >/dev/null 2>&1 || {
              echo "python3 is required to unpack the Terraform release." >&2; exit 1; }
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            base="https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION"
            zip="terraform_${TERRAFORM_VERSION}_linux_${arch}.zip"
            curl -fsSL -o "$tmp/$zip" "$base/$zip"
            curl -fsSL -o "$tmp/SHA256SUMS" "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
            ( cd "$tmp" && grep -E "[[:space:]]${zip}\$" SHA256SUMS | sha256sum -c - )
            mkdir -p "$dest"
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extract('terraform', sys.argv[2])" \
              "$tmp/$zip" "$dest"
            chmod +x "$dest/terraform"
          else
            echo "Using cached Terraform at $dest"
          fi
          echo "$dest" >> "$GITHUB_PATH"

      - name: Terraform version
        run: terraform version

      # No `az` on this runner, so probe the instance metadata service directly.
      # This is the endpoint the provider uses to mint a token via MSI; if it
      # does not answer, the runner is not an Azure VM and MSI cannot work.
      - name: Verify managed identity is reachable
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          imds="http://169.254.169.254/metadata/identity/oauth2/token"
          url="$imds?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F"
          if [ -n "${ARM_CLIENT_ID:-}" ]; then
            url="$url&client_id=$ARM_CLIENT_ID"
          fi
          if curl -fsS --max-time 5 -H "Metadata: true" "$url" >/dev/null; then
            echo "IMDS returned a management token — managed identity is usable."
          else
            echo "Could not get a token from the Azure instance metadata service." >&2
            echo "ARM_USE_MSI only works when this runner is an Azure VM with an" >&2
            echo "identity assigned. Switch to service-principal auth otherwise." >&2
            exit 1
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -input=false

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve
