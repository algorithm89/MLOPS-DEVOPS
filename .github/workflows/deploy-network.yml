name: Deploy Network (Terraform)

# Manual trigger only — pick the action from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy

# Prevent two runs from touching the same remote state at once.
concurrency:
  group: terraform-network
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Provider auth uses the self-hosted runner's own Azure CLI login (az login),
  # so no service-principal secrets are needed. Just the target subscription.
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  # Storage account key so the backend can read/write the state blob.
  ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
  # tfvars is git-ignored, so pass machine-specific values as TF_VAR_* env.
  # Set ALLOWED_SSH_SOURCE_IP as a repo *variable* (e.g. 70.81.108.249/32).
  TF_VAR_allowed_ssh_source_ip: ${{ vars.ALLOWED_SSH_SOURCE_IP }}

jobs:
  terraform:
    runs-on: [self-hosted, skynet]
    defaults:
      run:
        working-directory: infra/network

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-terraform downloads a .zip and shells out to `unzip`, which is
      # missing on the bare runner image.
      - name: Ensure unzip is available
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v unzip >/dev/null 2>&1; then
            echo "unzip already installed"; exit 0
          fi
          # -n so a runner without passwordless sudo fails fast instead of
          # blocking on a password prompt nobody can answer.
          if [ "$(id -u)" -eq 0 ]; then SUDO=
          elif sudo -n true 2>/dev/null; then SUDO="sudo -n"
          else
            echo "unzip is missing and this runner has no passwordless sudo." >&2
            echo "Install it once on the runner: sudo apt-get install -y unzip" >&2
            exit 1
          fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq unzip
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y unzip
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache unzip
          else
            echo "No supported package manager found; install unzip on the runner." >&2
            exit 1
          fi

      # The self-hosted runner has no Terraform on PATH, so install a pinned
      # version rather than relying on whatever the box happens to have.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # Without this the action wraps terraform in a script that mangles
          # stdout, which makes plan output hard to read in the run log.
          terraform_wrapper: false

      - name: Terraform version
        run: terraform version

      - name: Verify Azure CLI login
        run: az account show --query "{subscription:name, id:id, user:user.name}" -o json

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -input=false

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve
